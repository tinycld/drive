name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PACKAGE: drive
  TEST_USER_LOGIN: user@tinycld.org
  TEST_USER_PW: TestUser1234!
  ADMIN_USER_LOGIN: admin@tinycld.org
  ADMIN_USER_PW: AdminPass1234!

# Supersede in-flight runs for the same ref. A new push cancels the prior
# run immediately instead of letting it occupy a runner (the scaffold step
# can intermittently hang — see the explicit timeout-minutes below).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Unit
    runs-on: ubuntu-latest
    # Without an explicit cap a hung step rides GitHub's 6-hour default,
    # blocking the PR and burning a runner the whole time.
    timeout-minutes: 20
    steps:
      # This PR's code, checked out into its member slot. The workspace root is
      # not a committed repo — bootstrap assembles it from scratch around this
      # checkout. `--assemble-only` clones the `tinycld` member (app shell + core
      # + package-scripts) plus this PACKAGE, skipping PACKAGE's slot since it's
      # already present, so CI tests this PR's code.
      - uses: actions/checkout@v5
        with:
          path: ws/${{ env.PACKAGE }}
      - name: Resolve sibling ref
        id: sibling
        run: |
          # Coordinated cross-repo work (e.g. the single-org migration) lives on
          # the SAME branch name in every repo. Assembling against tinycld's
          # default branch then typechecks this PR against a core that predates
          # it — the branch's own APIs are simply absent, so every consumer
          # fails with errors that look like the PR's fault.
          #
          # Prefer a tinycld branch matching this PR's HEAD; fall back to the
          # default when there is none (the ordinary single-repo PR).
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ -n "$BRANCH" ] && \
             git ls-remote --exit-code --heads https://github.com/tinycld/tinycld "$BRANCH" >/dev/null 2>&1; then
            echo "ref=@$BRANCH" >> "$GITHUB_OUTPUT"
            echo "Assembling against tinycld@$BRANCH"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "No tinycld branch named '$BRANCH'; assembling against its default branch"
          fi
      - name: Assemble workspace (app + core)
        working-directory: ws
        run: |
          TINYCLD_REPO_BASE=https://github.com/tinycld \
            npx @tinycld/bootstrap@latest --assemble-only \
            --with "tinycld${{ steps.sibling.outputs.ref }}"
      - uses: actions/setup-node@v5
        with:
          node-version-file: ws/.node-version
      # cache-dependency-path matters more than it looks: the install below runs a
      # postinstall that regenerates the PB schema, which shells out to Go and
      # pulls core's module graph. That download — not package fetching — is the
      # bulk of the install step's runtime.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/.go-version
          cache-dependency-path: |
            ws/drive/server/go.sum
            ws/drive/cli/go.sum
      # Cache pnpm's content-addressable store. setup-node's built-in `cache: pnpm`
      # can't be used: it keys on a lockfile hash, and the workspace root here is
      # bootstrap-GENERATED, so no lockfile exists until the install produces one.
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ws/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('ws/package.json', 'ws/pnpm-workspace.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install (workspace root)
        working-directory: ws
        run: corepack enable && pnpm install --no-frozen-lockfile --store-dir=.pnpm-store
      - name: Typecheck + unit
        working-directory: ws/${{ env.PACKAGE }}
        run: pnpm exec tinycld-pkg check
      # cli/ is a second Go module (tinycld.org/packages/drive/cli) that
      # tinycld-pkg does not cover. Its go.work — which resolves
      # tinycld.org/cli against the assembled app shell — is emitted by the
      # generator during the install above, so this must follow it.
      #
      # Deliberately no `go mod download`: with no arguments it resolves the
      # ENTIRE module graph, including the tinycld.org/core requirement this
      # module inherits through `replace tinycld.org/packages/drive => ../server`
      # and which only the server's own go.work resolves. build/test are fine
      # because pruning means they only load what is actually imported, and the
      # api package this depends on is import-free by design.
      - name: Go build & test (cli)
        working-directory: ws/${{ env.PACKAGE }}/cli
        run: go build ./... && go test ./...

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # A clean E2E run is ~12 min (assemble + install + scaffold + playwright
    # + the suite). 30 leaves headroom for a slow cold Metro compile while
    # still failing fast if the scaffold step hangs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: ws/${{ env.PACKAGE }}
      - name: Resolve sibling ref
        id: sibling
        run: |
          # Coordinated cross-repo work (e.g. the single-org migration) lives on
          # the SAME branch name in every repo. Assembling against tinycld's
          # default branch then typechecks this PR against a core that predates
          # it — the branch's own APIs are simply absent, so every consumer
          # fails with errors that look like the PR's fault.
          #
          # Prefer a tinycld branch matching this PR's HEAD; fall back to the
          # default when there is none (the ordinary single-repo PR).
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ -n "$BRANCH" ] && \
             git ls-remote --exit-code --heads https://github.com/tinycld/tinycld "$BRANCH" >/dev/null 2>&1; then
            echo "ref=@$BRANCH" >> "$GITHUB_OUTPUT"
            echo "Assembling against tinycld@$BRANCH"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "No tinycld branch named '$BRANCH'; assembling against its default branch"
          fi
      - name: Assemble workspace (app + core)
        working-directory: ws
        run: |
          TINYCLD_REPO_BASE=https://github.com/tinycld \
            npx @tinycld/bootstrap@latest --assemble-only \
            --with "tinycld${{ steps.sibling.outputs.ref }}"
      - uses: actions/setup-node@v5
        with:
          node-version-file: ws/.node-version
      # cache-dependency-path matters more than it looks: the install below runs a
      # postinstall that regenerates the PB schema, which shells out to Go and
      # pulls core's module graph. That download — not package fetching — is the
      # bulk of the install step's runtime.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/.go-version
          cache-dependency-path: |
            ws/drive/server/go.sum
            ws/drive/cli/go.sum
      # Cache pnpm's content-addressable store. setup-node's built-in `cache: pnpm`
      # can't be used: it keys on a lockfile hash, and the workspace root here is
      # bootstrap-GENERATED, so no lockfile exists until the install produces one.
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ws/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('ws/package.json', 'ws/pnpm-workspace.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install (workspace root)
        working-directory: ws
        run: corepack enable && pnpm install --no-frozen-lockfile --store-dir=.pnpm-store
      # Drive's share-link E2E mounts an editor for a doc, but the editor
      # itself is contributed by a package OTHER than drive (text, calc,
      # etc.). To avoid coupling drive's CI to those packages' internals,
      # we scaffold @tinycld/share-stub — a minimal package that registers
      # a share editor for `application/x-tinycld-stub` and renders the
      # mount object's fields as data-test-ids. Drive's stub specs upload
      # `.stub` files and assert on the stub's output, so this CI verifies
      # drive's OWN contract: route → registry → mount-with-right-fields.
      # ~20s normally; it has hung indefinitely after its inner pnpm
      # install (the process failed to exit). Cap it so the failure is
      # attributed here and the job fails in minutes, not hours.
      # Shared e2e prep: installs the Playwright browser and pre-builds the
      # static web bundle. e2e serves it statically (no Metro), so watchman is
      # gone; the E2E step reuses the build via TINYCLD_E2E_SKIP_EXPORT. The
      # scaffold above runs first so the stub's routes are in the bundle.
      - name: Configure test env
        uses: ./ws/tinycld/.github/actions/configure-test-env
      - name: E2E
        working-directory: ws/${{ env.PACKAGE }}
        env:
          TINYCLD_E2E_SKIP_EXPORT: '1'
        run: pnpm exec tinycld-pkg test:e2e
      # Capture Playwright's per-failure artifacts (trace, screenshot,
      # video, error-context.md) so a CI failure can be diagnosed
      # without a re-run. `if: failure()` skips the upload on green
      # runs to save bandwidth + retention.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            ws/${{ env.PACKAGE }}/test-results/
            ws/${{ env.PACKAGE }}/playwright-report/
          retention-days: 14
