name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PACKAGE: drive
  TEST_USER_LOGIN: user@tinycld.org
  TEST_USER_PW: TestUser1234!
  ADMIN_USER_LOGIN: admin@tinycld.org
  ADMIN_USER_PW: AdminPass1234!

jobs:
  check:
    name: Typecheck & Unit
    runs-on: ubuntu-latest
    steps:
      # 1. The workspace meta-repo becomes the job root.
      - uses: actions/checkout@v5
        with:
          repository: tinycld/workspace
          ref: main
          path: ws
      # 2. This PR's code, checked out into the member slot.
      - uses: actions/checkout@v5
        with:
          path: ws/${{ env.PACKAGE }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: ws/.node-version
          cache: npm
          cache-dependency-path: ws/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/.go-version
      # 3. Clone app + core (the PR's PACKAGE is already checked out into its
      #    slot; bootstrap skips dirs that already exist). A sibling only
      #    needs app + core + itself to typecheck + unit-test.
      - name: Assemble workspace (app + core)
        working-directory: ws
        run: TINYCLD_REPO_BASE=https://github.com/tinycld npx @tinycld/bootstrap@latest --assemble-only
      - name: Install (workspace root)
        working-directory: ws
        run: npm install
      - name: Typecheck + unit
        working-directory: ws/${{ env.PACKAGE }}
        run: npx tinycld-pkg check

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: tinycld/workspace
          ref: main
          path: ws
      - uses: actions/checkout@v5
        with:
          path: ws/${{ env.PACKAGE }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: ws/.node-version
          cache: npm
          cache-dependency-path: ws/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/.go-version
      # Metro warns "Watchman was not found in PATH" without this and falls
      # back to fs.watch polling. Under multi-worker Playwright load the
      # polling fallback compounds enough that Metro can go silent for 70+s
      # on a `page.reload()`-triggered bundle re-fetch, surfacing as a
      # blank-page-after-reload flake (see prior failed runs on this repo).
      # The release zip is the only Linux distribution channel; pin to a
      # known-working tag rather than `latest` so a future release breaking
      # the zip layout doesn't silently break CI.
      - name: Install watchman
        run: |
          curl -fsSL -o /tmp/watchman.zip https://github.com/facebook/watchman/releases/download/v2026.05.11.00/watchman-v2026.05.11.00-linux.zip
          unzip -q /tmp/watchman.zip -d /tmp/watchman
          sudo mv /tmp/watchman/watchman-v2026.05.11.00-linux/bin/* /usr/local/bin/
          sudo mv /tmp/watchman/watchman-v2026.05.11.00-linux/lib/* /usr/local/lib/
          # ldconfig picks up the libgflags / libglog / libsnappy bundled in
          # the zip so the watchman binary's runtime linker resolves them.
          sudo ldconfig
          sudo mkdir -p /usr/local/var/run/watchman
          sudo chmod 2777 /usr/local/var/run/watchman
          watchman --version
      - name: Assemble workspace (app + core)
        working-directory: ws
        run: TINYCLD_REPO_BASE=https://github.com/tinycld npx @tinycld/bootstrap@latest --assemble-only
      - name: Install (workspace root)
        working-directory: ws
        run: npm install
      # Drive's share-link E2E mounts an editor for a doc, but the editor
      # itself is contributed by a package OTHER than drive (text, calc,
      # etc.). To avoid coupling drive's CI to those packages' internals,
      # we scaffold @tinycld/share-stub — a minimal package that registers
      # a share editor for `application/x-tinycld-stub` and renders the
      # mount object's fields as data-test-ids. Drive's stub specs upload
      # `.stub` files and assert on the stub's output, so this CI verifies
      # drive's OWN contract: route → registry → mount-with-right-fields.
      - name: Scaffold share-stub package
        working-directory: ws
        run: npx tsx ${{ env.PACKAGE }}/tests/scripts/scaffold-share-stub.ts
      - name: Install Playwright browsers
        working-directory: ws/app
        run: npx playwright install --with-deps chromium
      - name: E2E
        working-directory: ws/${{ env.PACKAGE }}
        env:
          # Pre-warm drive's lazy screen chunk in globalSetup so the
          # first test per worker doesn't race the cold Metro compile.
          # See tinycld/app#18.
          TINYCLD_WARM_PACKAGES: drive
        run: npx tinycld-pkg test:e2e
      # Capture Playwright's per-failure artifacts (trace, screenshot,
      # video, error-context.md) so a CI failure can be diagnosed
      # without a re-run. `if: failure()` skips the upload on green
      # runs to save bandwidth + retention.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            ws/${{ env.PACKAGE }}/test-results/
            ws/${{ env.PACKAGE }}/playwright-report/
          retention-days: 14
